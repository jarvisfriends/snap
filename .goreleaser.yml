version: 2

project_name: snap

before:
  hooks:
    - go mod tidy
    - go -C tools/rendertapes mod tidy

# -s -w strips debug symbols (smaller release binaries) and -X injects the
# release tag into exui.Version, so the distributed binary is
# self-identifying via --version.
builds:
  - id: snap_input
    binary: snap_input
    main: ./examples/snap_input
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible builds: strip host paths and pin the embedded mod time.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/jarvisfriends/snap/examples/internal/exui.Version={{.Version}}

# One snap_input archive per OS/arch: every example ships as a subcommand of
# the single scriptable tool (examples/USAGE.md explains the
# stdout/stderr/exit-code contract), so one small download replaces the old
# 14 per-example archives.
archives:
  - id: snap_input
    ids: [snap_input]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - CHANGELOG.md
      - src: examples/USAGE.md
        dst: USAGE.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    output: false
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  github:
    owner: jarvisfriends
    name: snap
  # The README gallery links these as releases/latest/download/<name>.gif, so
  # every release has to carry them or the gallery breaks the moment a new tag
  # becomes "latest". Attaching them here, as the release is created, is also
  # the only option: the repo has immutable releases enabled, so adding assets
  # to a published tag fails with "Cannot upload assets to an immutable
  # release" (HTTP 422).
  #
  # release.yml renders the tapes and moves the gifs here before goreleaser
  # starts. They cannot stay in dist/: a `before` hook runs ahead of the
  # "ensuring distribution directory" step, so anything it leaves in dist/
  # trips "dist is not empty" — and a plain workflow step writing there is
  # wiped by --clean.
  extra_files:
    - glob: demo-gifs/*.gif

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
