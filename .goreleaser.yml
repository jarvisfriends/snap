    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: timepicker
    binary: timepicker
    main: ./examples/timepicker
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# One archive per example (not one combined archive per OS/arch): each example
# is a small, standalone, scriptable tool (examples/USAGE.md explains the
# stdout/stderr/exit-code contract), so it ships as its own
# snap_<example>_<os>_<arch> download instead of bundling all 14 binaries
# together under one example's name.
archives:
  - id: cellcanvas
    ids: [cellcanvas]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - CHANGELOG.md
      - src: examples/USAGE.md
        dst: USAGE.md
  - id: charts
    ids: [charts]
    formats: [tar.gz]
