checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    output: false
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  github:
    owner: jarvisfriends
    name: snap

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
