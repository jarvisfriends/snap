name: Auto-release

# Turns a merge to the default branch into a release decision using gorelease's
# API-compatibility analysis (the logic lives in tools/releasetag, not in shell):
#
#   - On a pull request it posts a comment describing what will happen on merge.
#   - On merge, a backward-compatible change is auto-tagged as a patch. A minor
#     or major bump is never auto-tagged; it is surfaced for maintainer review.

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Release plan (PR preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Install gorelease
        # renovate: datasource=go depName=golang.org/x/exp
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260718201538-764159d718ef
      - name: Plan release
        run: |
          go build -C tools/releasetag -o "$RUNNER_TEMP/releasetag" .
          "$RUNNER_TEMP/releasetag" -mode plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: CI
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  tag:
    name: Auto-tag patch
    if: github.event_name == 'push'
    needs: [ci]
    runs-on: ubuntu-24.04
    env:
      # secrets can't be tested directly in step `if:`; hoist to env
      HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout with PAT
        if: env.HAS_RELEASE_PAT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Checkout with default token
        if: env.HAS_RELEASE_PAT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Install gorelease
        # renovate: datasource=go depName=golang.org/x/exp
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260718201538-764159d718ef
      - name: Apply release
        run: |
          go build -C tools/releasetag -o "$RUNNER_TEMP/releasetag" .
          "$RUNNER_TEMP/releasetag" -mode apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}