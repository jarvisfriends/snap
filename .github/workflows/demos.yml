name: Demos

# The demo gifs are build artifacts rendered into dist/, not committed sources
# (.gitignore), so the README gallery has to point at hosted copies. This
# workflow owns that pipeline, because rendering needs Docker and a
# maintainer's laptop is not a reliable place to keep 14 hosted URLs fresh:
#
#   - On a PR that touches tapes or example sources, render every tape in the
#     vhs container and upload the gifs as an artifact. Nothing is published:
#     this only proves the tapes still record.
#   - On merge to the default branch (or on demand), render, `vhs publish`
#     each gif, and open a PR carrying the refreshed examples/*.gif.url files
#     and the rewritten markdown links.
#
# rendertapes does the work in both cases; see tools/rendertapes/main.go.

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'examples/**'
      - 'tools/rendertapes/**'
      - '.github/workflows/demos.yml'
  push:
    branches: [ "main", "master" ]
    # Deliberately excludes *.gif.url and *.md so this workflow's own PR,
    # once merged, cannot retrigger it.
    paths:
      - 'examples/*.tape'
      - 'examples/**/*.go'
      - 'tools/rendertapes/**'

concurrency:
  group: demos-${{ github.ref }}
  # Superseded PR renders are worth cancelling; a publish in flight is not —
  # it would leave some <gif>.url files updated and the rest stale.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  render:
    name: Render tapes (no publish)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # 14 tapes with multi-second Sleep directives, rendered on a worker pool.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Render every tape
        run: go -C tools/rendertapes run .
      - name: Upload rendered gifs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-gifs
          path: dist/*.gif
          if-no-files-found: error

  publish:
    name: Publish gifs and refresh doc links
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      # secrets can't be tested directly in step `if:`; hoist to env
      HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' }}
      BRANCH: demos/refresh-gif-links
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger workflow
      # runs, so its checks would sit empty. RELEASE_PAT (already used by
      # auto-release) avoids that; without it the PR still opens, but a
      # maintainer has to nudge CI.
      - name: Checkout with PAT
        if: env.HAS_RELEASE_PAT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.RELEASE_PAT }}
      - name: Checkout with default token
        if: env.HAS_RELEASE_PAT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Render and publish every tape
        run: go -C tools/rendertapes run . -publish
      - name: Open a PR with the refreshed links
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain -- '*.gif.url')" ]; then
            echo "Hosted links already current — nothing to open."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A -- '*.md' '*.gif.url'
          git commit -m 'demos: refresh hosted gif links'
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing PR for $BRANCH updated with a new push."
            exit 0
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Rendered every VHS tape in the vhs container, published each gif to
          Charm hosting, and repointed the markdown gallery at the new URLs.

          Generated by `.github/workflows/demos.yml`; the rendering, uploading,
          and link rewriting all live in `tools/rendertapes`.
          EOF
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title 'demos: refresh hosted gif links' \
            --body-file "$RUNNER_TEMP/pr-body.md"
