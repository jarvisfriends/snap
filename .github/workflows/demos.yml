name: Demos

# The demo gifs are build artifacts rendered into dist/, not committed sources
# (.gitignore), so the README gallery points at release assets instead:
# releases/latest/download/<name>.gif. That URL is fixed per demo, so nothing
# ever rewrites the markdown.
#
# Attaching those assets is goreleaser's job, not this workflow's: the repo
# has immutable releases enabled, so assets can only be added while the
# release is being created. `.goreleaser.yml` renders the tapes in a
# before-hook and ships them via release.extra_files. Uploading to an
# already-published tag fails with HTTP 422, which is what this workflow used
# to try.
#
# So all that is left here is validation: render every tape on a PR that
# touches them and keep the gifs as a build artifact, to prove they still
# record before a release depends on it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'examples/**'
      - 'tools/rendertapes/**'
      - '.github/workflows/demos.yml'

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render tapes
    runs-on: ubuntu-24.04
    # 14 tapes with multi-second Sleep directives, rendered on a worker pool.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Render every tape
        run: go -C tools/rendertapes run . -verbose
      - name: Upload rendered gifs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-gifs
          path: dist/*.gif
          if-no-files-found: error
