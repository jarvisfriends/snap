name: Scorecards

on:
  branch_protection_rule:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '31 5 * * 1'

# Top-level token is read-only; the analysis job elevates only what it needs
# (Scorecard TokenPermissions).
permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecards
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF results
      id-token: write # publish results to the OpenSSF API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: results.sarif