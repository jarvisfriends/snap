name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_call: # release workflows require CI to pass first

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target (drive listing, path handling);
        # ubuntu covers the release/lint platform.
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build
        run: go build ./...
      - name: Build releasetag (nested module)
        if: matrix.os == 'ubuntu-24.04'
        run: go -C tools/releasetag build ./...
      - name: Build rendertapes (nested module)
        if: matrix.os == 'ubuntu-24.04'
        run: go -C tools/rendertapes build ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-24.04'
        # Single test run produces the coverage profile — no separate coverage job.
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Test (race)
        if: matrix.os != 'ubuntu-24.04'
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vet releasetag (nested module)
        if: matrix.os == 'ubuntu-24.04'
        run: go -C tools/releasetag vet ./...
      - name: Vet rendertapes (nested module)
        if: matrix.os == 'ubuntu-24.04'
        run: go -C tools/rendertapes vet ./...
      - name: gofmt check
        if: matrix.os == 'ubuntu-24.04'
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt drift detected:"
            echo "$files"
            exit 1
          fi
      - name: go mod tidy check
        if: matrix.os == 'ubuntu-24.04'
        run: |
          go mod tidy
          go -C tools/releasetag mod tidy
          go -C tools/rendertapes mod tidy
          if ! git diff --exit-code -- go.mod go.sum tools/releasetag/go.mod tools/releasetag/go.sum tools/rendertapes/go.mod tools/rendertapes/go.sum; then
            echo "go mod tidy would change files — run 'go mod tidy' and commit the result"
            exit 1
          fi
      - name: go mod verify
        if: matrix.os == 'ubuntu-24.04'
        run: go mod verify
      - name: Coverage gate (library scope)
        if: matrix.os == 'ubuntu-24.04'
        env:
          COVERAGE_THRESHOLD: "90.0"
        # Library scope matches codecov.yml ignores: examples/, cmd/, tools/,
        # and testutil/ are demo/wiring code exercised by hand.
        run: |
          awk 'NR==1 || ($0 !~ /\/examples\// && $0 !~ /\/cmd\// && $0 !~ /\/tools\// && $0 !~ /\/testutil\//)' coverage.out > coverage.lib.out
          total=$(go tool cover -func=coverage.lib.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Library-scope statement coverage: ${total}%"
          awk -v p="$total" -v t="$COVERAGE_THRESHOLD" 'BEGIN { if (p+0 < t+0) { printf "Coverage %s%% is below the %s%% gate\n", p, t; exit 1 } printf "Coverage %s%% meets the %s%% gate\n", p, t }'
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.lib.out
      - name: Upload coverage to Codecov
        # Tokenless upload works on public repos; the action does not fail the
        # build if the upload errors. Coverage scope/ignores are in codecov.yml.
        if: matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jarvisfriends/snap
          files: ./coverage.out
      - name: Upload coverage to Coveralls
        # Non-fatal: no-op until the repo is connected on coveralls.io.
        if: matrix.os == 'ubuntu-24.04'
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: go

  drift:
    name: Drift (go generate, go fix)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Install stringer
        # Pinned: bump alongside the golang.org/x/tools dependency.
        run: go install golang.org/x/tools/cmd/stringer@v0.47.0
      - name: Check for go generate drift
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "go generate produced changes — run 'go generate ./...' locally and commit the result"
            exit 1
          fi
      - name: Check for go fix drift
        run: |
          if ! go fix -diff ./...; then
            echo "go fix found suggestions — run 'go fix ./...' locally, review the diff, and commit the result"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Lint (GOOS=linux, full)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned: keep in sync with tui-base and tools/local_verify.sh.
          version: v2.12.2
      - name: Find OS-specific packages
        id: ospkgs
        # Only packages whose sources diverge by OS (file suffixes or
        # //go:build tags) need a second-GOOS lint pass — everything else
        # typechecks identically, so a full re-run is pure duplication.
        # Keep the detection in sync with tools/local_verify.sh.
        run: |
          pkgs=$({
            git ls-files '*_windows.go' '*_linux.go' '*_unix.go' '*_darwin.go' '*_other.go'
            git ls-files '*.go' | xargs -r grep -lE '^//go:build .*(windows|linux|darwin|unix)' || true
          } | xargs -r -n1 dirname | sort -u | sed 's|^|./|; s|$|/...|' | tr '\n' ' ')
          echo "pkgs=${pkgs}" >> "$GITHUB_OUTPUT"
          echo "OS-specific packages: ${pkgs:-none}"
      - name: Lint (GOOS=windows, OS-specific packages only)
        if: steps.ospkgs.outputs.pkgs != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          GOOS: windows
          GOARCH: amd64
        with:
          version: v2.12.2
          args: ${{ steps.ospkgs.outputs.pkgs }}
      - name: Lint rendertapes (nested module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: tools/rendertapes
      - name: Lint releasetag (nested module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: tools/releasetag

  static-checks:
    name: Static checks (workflows, shell, docs, headers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1
      - name: Shellcheck scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './'
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24
        with:
          globs: |
            **/*.md
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        env:
          # Authenticated GitHub requests avoid the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail: true
          args: --no-progress --verbose --max-retries 3 --retry-wait-time 5 "./**/*.md"
      - name: SPDX license header check
        run: |
          missing=0
          while IFS= read -r f; do
            if head -1 "$f" | grep -q "^// Code generated"; then continue; fi
            if ! head -3 "$f" | grep -q "SPDX-License-Identifier:"; then
              echo "::error file=$f::missing copyright/SPDX header"
              missing=1
            fi
          done < <(git ls-files '*.go')
          exit $missing

  security:
    name: Security (govulncheck, gitleaks, dependency review)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks scans full history
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Run gitleaks (secret scan)
        # Pinned by version + sha256 instead of a third-party action
        # (gitleaks-action requires a license key for org repos).
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Run timed fuzz smoke
        env:
          FUZZTIME: 10s
        run: bash tools/fuzz.sh
